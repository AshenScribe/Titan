spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  application:
    name: product-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  model-and-view-allowed: false

titan:
  grpc:
    port: ${GRPC_PORT:9091}
  cache:
    l1-enabled: true
    l1-maximum-size: 10000
    l1-ttl: 30s
    l2-enabled: false
    l2-ttl: 10m
    negative-ttl: 10s
    ttl-jitter: 30s
    invalidation-enabled: true
    invalidation-channel: titan:cache:invalidation:v1
    namespace: titan:product:v1
    distributed-lock-enabled: false
    lock-lease: 5s
    lock-wait: 250ms