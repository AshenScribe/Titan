name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run build, tests, static checks, and coverage verification
        run: ./gradlew check --no-daemon --console=plain

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/build/reports/
            ${{ matrix.service }}/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Build container (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag titan/${{ matrix.service }}:${{ github.sha }} -f ${{ matrix.service }}/Dockerfile .

      - name: Validate Compose configuration
        run: docker compose config --quiet
