syntax = "proto3";

package titan.product.catalog.v1;

option java_multiple_files = true;
option java_package = "com.titan.product.catalog.v1";
option java_outer_classname = "ProductCatalogProto";

service ProductCatalogService {
  rpc GetActiveVariant(GetActiveVariantRequest) returns (GetActiveVariantResponse);
}

message GetActiveVariantRequest {
  string variant_id = 1;
}

message GetActiveVariantResponse {
  string variant_id = 1;
  string product_id = 2;
  string product_name = 3;
  string variant_name = 4;
  string sku = 5;
  string unit_price = 6;
  string currency = 7;
  string attributes_json = 8;
}
