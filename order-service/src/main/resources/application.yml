spring:
  application:
    name: order-service
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        preparedStatementCacheQueries: ${DB_PS_CACHE_QUERIES:256}
        preparedStatementCacheSizeMiB: ${DB_PS_CACHE_SIZE_MIB:5}
        prepareThreshold: ${DB_PREPARE_THRESHOLD:5}
        autosave: ${DB_AUTOSAVE:conservative}
        tcpNodelay: ${DB_TCP_NODELAY:true}
        ApplicationName: ${DB_APPLICATION_NAME:order-service}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}

titan:
  product:
    grpc:
      host: ${PRODUCT_SERVICE_GRPC_HOST:localhost}
      port: ${PRODUCT_SERVICE_GRPC_PORT:9091}
      deadline: ${PRODUCT_SERVICE_GRPC_DEADLINE:500ms}
  grpc:
    port: ${GRPC_PORT:9092}
  cache:
    l1-enabled: true
    l1-maximum-size: 10000
    l1-ttl: 30s
    l1-tti: 10s
    l2-enabled: false
    l2-ttl: 10m
    l2-tti: 10s
    negative-ttl: 10s
    ttl-jitter: 30s
    invalidation-enabled: true
    invalidation-channel: titan:cache:invalidation:v1
    namespace: titan:product:v1
    distributed-lock-enabled: false
    lock-lease: 5s
    lock-wait: 250ms
